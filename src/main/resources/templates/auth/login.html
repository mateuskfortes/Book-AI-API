<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book AI | Login</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f172a;
            --card: #111827;
            --border: #243244;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --error: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Inter, Arial, sans-serif;
            background: radial-gradient(circle at top, #1e293b, var(--bg) 50%);
            color: var(--text);
        }

        .auth-card {
            width: min(440px, calc(100vw - 2rem));
            padding: 2rem;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: rgba(17, 24, 39, 0.92);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.75rem;
            border-radius: 999px;
            background: rgba(124, 58, 237, 0.15);
            color: #c4b5fd;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
        }

        p {
            color: var(--muted);
            line-height: 1.5;
        }

        form {
            display: grid;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        label {
            display: grid;
            gap: 0.5rem;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 0.95rem 1rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #0b1220;
            color: var(--text);
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.18);
        }

        button {
            border: 0;
            border-radius: 12px;
            padding: 0.95rem 1rem;
            background: linear-gradient(135deg, var(--accent), #4f46e5);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: linear-gradient(135deg, var(--accent-hover), #4338ca);
        }

        .message {
            min-height: 1.25rem;
            font-size: 0.95rem;
        }

        .message.error {
            color: var(--error);
        }

        .message.success {
            color: var(--success);
        }

        .footer {
            margin-top: 1rem;
            color: var(--muted);
            text-align: center;
        }

        a {
            color: #c4b5fd;
            text-decoration: none;
        }
    </style>
</head>
<body>
<main class="auth-card">
    <div class="badge">Book AI</div>
    <h1>Sign in</h1>
    <p>Access your account to continue using the API.</p>

    <div id="message" class="message"></div>

    <form id="login-form">
        <label>
            Email
            <input id="email" name="email" type="email" autocomplete="email" required>
        </label>

        <label>
            Password
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>

        <button type="submit">Login</button>
    </form>

    <p class="footer">No account yet? <a href="/signup">Create one</a></p>
</main>

<script>
    const message = document.getElementById('message');
    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');

    const params = new URLSearchParams(window.location.search);
    const registeredEmail = params.get('email');
    const registered = params.get('registered');

    if (registered === '1') {
        message.textContent = 'Account created successfully. Sign in with your credentials.';
        message.className = 'message success';
    }

    if (registeredEmail) {
        emailInput.value = registeredEmail;
    }

    function setMessage(text, type) {
        message.textContent = text;
        message.className = `message ${type}`;
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        setMessage('Signing in...', 'success');

        const payload = {
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch('/api/auth/signin', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(data.message || 'Unable to sign in.');
            }

            localStorage.setItem('book-ai-token', data.token);
            setMessage('Login successful. Token saved in localStorage.', 'success');
        } catch (error) {
            setMessage(error.message, 'error');
        }
    });
</script>
</body>
</html>
